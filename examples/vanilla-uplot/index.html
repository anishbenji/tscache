<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tscache · live server metrics</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Live server metrics</h1>
      <nav><a href="/events.html">Sparse event counts →</a></nav>
    </header>
    <p class="stats">
      Mode <output data-testid="mode">…</output> ·
      backend fetches <output data-testid="fetches">0</output> ·
      final points <output data-testid="final">0</output> ·
      provisional points <output data-testid="provisional">0</output> ·
      <output data-testid="status">connecting</output>
    </p>
    <div id="chart"></div>
    <p>
      <button type="button" id="bump">Restate history (new dataset version)</button>
    </p>
    <h2>Log</h2>
    <ol id="log" reversed></ol>
    <script type="module" src="/src/metrics.ts"></script>
  </body>
</html>
