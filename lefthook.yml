# Hook staging per starter prompt §4: pre-commit stays sub-second;
# heavyweight checks run pre-push; `bun run ci` is the full superset.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: gitleaks
      run: gitleaks git --staged --pre-commit --redact

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: bun run typecheck
    - name: biome-full
      run: bunx biome check .
    # The checks that read the built package, in order after one build, as
    # in scripts/ci.sh: Knip loads the examples' Vite configs, which import
    # tscache/vite from dist/, and the integration snippets type-check
    # against it, as an app would.
    - name: built
      group:
        piped: true
        jobs:
          - name: build
            run: bun run build >/dev/null
          - name: knip
            run: bunx knip
          - name: integrations
            run: bun run check:integrations
    - name: fallow
      run: bun run fallow
    - name: tests
      run: bunx vitest run --passWithNoTests
