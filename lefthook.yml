# Hook staging per starter prompt §4: pre-commit stays sub-second;
# heavyweight checks run pre-push; `bun run ci` is the full superset.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: gitleaks
      run: gitleaks git --staged --pre-commit --redact

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

# Script jobs live in <source_dir>/<hook>/; the one script job,
# scripts/check-push-email.ts, is named relative to scripts/pre-push/.
source_dir: scripts/

# The address check runs first and alone: it reads git's pre-push stdin
# (use_stdin), and the piped top level skips the heavy checks when it fails.
# It is a script job, not a run job: Lefthook 2.2.2 skips a pre-push run job
# when it finds no push files (an empty commit, a commit that only deletes a
# file, a branch other than HEAD), never a script job.
pre-push:
  piped: true
  jobs:
    - name: push-email
      script: ../check-push-email.ts
      runner: bun
      use_stdin: true
    - name: checks
      group:
        parallel: true
        jobs:
          - name: typecheck
            run: bun run typecheck
          # The checks that read the built package, in order after one build, as
          # in scripts/ci.sh: Biome's promise rules read the package's types from
          # dist/, Knip loads the examples' Vite configs, which import
          # @anishbenji/tscache/vite from dist/, and the integration snippets type-check
          # against it, as an app would.
          - name: built
            group:
              piped: true
              jobs:
                - name: build
                  run: bun run build >/dev/null
                - name: biome-full
                  run: bunx biome check .
                - name: knip
                  run: bunx knip
                - name: integrations
                  run: bun run check:integrations
          - name: fallow
            run: bun run fallow
          # The health floor, as in scripts/ci.sh (step 83).
          - name: fallow-health
            run: bun run fallow:health
          - name: tests
            run: bunx vitest run --passWithNoTests
