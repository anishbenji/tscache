# Stages @anishbenji/tscache on npm and drafts the GitHub release.
#
# CI never makes a version public. A pushed v* tag stages the package with
# `npm stage publish`; the maintainer then approves the staged version with
# 2FA (npmjs.com, Staged Packages tab, or `npm stage approve <stage-id>`),
# which publishes it, and publishes the draft GitHub release afterwards.
# That approval is the final human gate.
#
# A manual run (workflow_dispatch) is a dry run unless it is started on a v*
# tag with dry-run unticked, which is the way to retry a failed stage. Every
# other combination ends in `npm stage publish --dry-run`.
#
# Staging uses npm trusted publishing (OIDC): no npm token exists, and this
# workflow reads no secret. The trusted publisher on npmjs.com allows only
# `npm stage publish`. The maintainer steps are in docs/releasing.md.
#
# Actions are pinned to commit SHAs, with the release in a comment;
# Dependabot keeps the pins current.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run `npm stage publish --dry-run` instead of staging
        type: boolean
        default: true

env:
  # Staged publishing needs npm 11.15.0 or later. Pinned to the newest npm
  # on 9 November 2026 (docs/reviews/step-64.md); the stage jobs install it
  # and check the installed version.
  NPM_VERSION: 12.2.2

# No job inherits a permission: each one states what it needs.
permissions: {}

# One release run per ref at a time, and never cancel one: a run cut off
# after staging leaves the draft GitHub release missing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Reads the version and decides whether this run stages for real. Fails
  # fast, before CI, when the tag and the package version disagree or the
  # release notes are missing.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      stage: ${{ steps.plan.outputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          version="$(jq -r .version packages/tscache/package.json)"
          # Plain X.Y.Z only: npm refuses a prerelease without --tag, and the
          # tag of a staged package cannot be changed later.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::packages/tscache/package.json version ${version} is not a plain X.Y.Z release version"
            exit 1
          fi

          stage=false
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v${version}" ]; then
              echo "::error::Tag ${REF_NAME} does not match packages/tscache/package.json version ${version} (expected v${version})"
              exit 1
            fi
            if [ "$EVENT" = push ] || [ "$DRY_RUN" = false ]; then
              stage=true
            fi
          fi

          notes="docs/releases/${version}.md"
          if [ ! -f "$notes" ]; then
            if [ "$stage" = true ]; then
              echo "::error::Release notes ${notes} are missing"
              exit 1
            fi
            echo "::warning::Release notes ${notes} are missing; a real release would fail here"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "stage=${stage}" >> "$GITHUB_OUTPUT"
          echo "Version ${version}, stage for real: ${stage}" >> "$GITHUB_STEP_SUMMARY"

  # The full CI gate (scripts/ci.sh) on the released commit. The bench job is
  # skipped: it compares a head against its base, and a release has no base.
  ci:
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      skip-bench: true

  # Builds the package and packs the exact tarball that is staged, in a job
  # with no OIDC permission. The stage jobs install no project dependency and
  # run no project code.
  pack:
    needs: [plan, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # tsdown, then publint and attw on the built package.
      - run: bun run build

      - id: pack
        working-directory: packages/tscache
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          dest="${RUNNER_TEMP}/package"
          mkdir -p "$dest"
          npm pack --pack-destination "$dest"
          tarball="anishbenji-tscache-${VERSION}.tgz"
          if [ ! -f "${dest}/${tarball}" ]; then
            echo "::error::Expected ${tarball}; npm pack wrote: $(ls "$dest")"
            exit 1
          fi
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  # A real stage. The only job that can mint an OIDC token (id-token:
  # write), which npm exchanges for a short-lived token that the trusted
  # publisher allows to run `npm stage publish` only, and which signs the
  # provenance statement. The npm-publish environment is the one named in
  # the trusted-publisher configuration on npmjs.com. The staged version
  # stays private until the maintainer approves it with 2FA.
  stage:
    needs: [plan, pack]
    if: needs.plan.outputs.stage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # No registry-url: it would write an .npmrc that reads NODE_AUTH_TOKEN,
      # and no token exists. npm's default registry is registry.npmjs.org.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the pinned npm
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      # npm prints "+ <name>@<version> (staged with id <stage-id>)"; the
      # summary repeats it for `npm stage view` and `npm stage approve`.
      - name: Stage
        working-directory: ${{ runner.temp }}/package
        shell: bash
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: |
          npm stage publish "./${TARBALL}" --provenance --access public 2>&1 | tee stage.log
          {
            echo "### Staged, not yet published"
            echo
            grep -E '\(staged' stage.log || echo "(no stage id in the npm output; see npm stage list)"
            echo
            echo 'Approve with 2FA on npmjs.com (Staged Packages tab) or with `npm stage approve <stage-id>`, then publish the draft GitHub release.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Every run that does not stage for real: the same tarball through
  # `npm stage publish --dry-run`, without the environment and without OIDC.
  stage-dry-run:
    needs: [plan, pack]
    if: needs.plan.outputs.stage != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the pinned npm
        run: |
          npm install --global "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Stage (dry run)
        working-directory: ${{ runner.temp }}/package
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: npm stage publish "./${TARBALL}" --dry-run --access public

  # A draft GitHub release for the tag, from docs/releases/<version>.md,
  # after a successful stage. It stays a draft because the version is not on
  # npm until the maintainer approves it; the maintainer publishes the draft
  # after approving. The only job that may write to the repository.
  github-release-draft:
    needs: [plan, stage]
    if: needs.plan.outputs.stage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Skips a release that already exists, draft or not, so a retried run
      # does not fail here.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            exit 0
          fi
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "docs/releases/${VERSION}.md"
