# Update pull requests are proposals: upgrading a dependency is a decision
# (AGENTS.md), so each one is reviewed and merged by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    # A release ages before Dependabot proposes it, for the reason given on
    # the bun entry below. Every Actions update waits 7 days: Actions support
    # only default-days, not the per-semver keys.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    # A release must age before Dependabot proposes it, so a compromised or
    # broken version has time to be noticed and pulled first: 3 days for patch
    # and minor (minor and patch fall back to default-days), 7 for a major.
    # Cooldown is checked per dependency, inside groups too. It holds back
    # version updates only: security updates still open at once, and an
    # upgrade approved by hand is not affected.
    cooldown:
      default-days: 3
      semver-major-days: 7
    # A dependency joins the first group it matches, so the lockstep groups
    # come first. React and react-dom must move together (react-dom's server
    # build fails against an older react), as must Solid and its @solidjs/*
    # packages; each pair arrives as one pull request at any update type.
    # Other patch and minor bumps arrive together; a major bump gets its own
    # pull request, so it can be judged against its changelog on its own.
    groups:
      react:
        patterns: ["react", "react-dom"]
      solid:
        patterns: ["solid-js", "@solidjs/*"]
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
