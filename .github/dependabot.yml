# Update pull requests are proposals: upgrading a dependency is a decision
# (AGENTS.md), so each one is reviewed and merged by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      dev-dependencies:
        dependency-type: development
