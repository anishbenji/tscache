name: Feature request
description: Suggest a change or an addition to tscache.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [roadmap](https://github.com/anishbenji/tscache/blob/main/docs/roadmap.md) first: it lists what v1 leaves out on purpose.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and why tscache makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you have in mind, for example the API you would like to call.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you considered.
